<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey | Deepwoken Relics</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li>
            <a href="index.html">Home Page</a>
          </li>
          <li>
            <a href="relic-survey.html">Survey About Relics</a>
          </li>
        </ul>
      </nav>
      <h1>Relic Survey</h1>
    </header>
    <!-- 
      This is a form about the relics that we talked about in this website. 
    -->
    <form>
      <fieldset>
        <legend>Which of these <i>relics</i> are the Idol of Yun'shul?</legend>
        <input type="radio" id="sinner-ash" name="relic-pic" />
        <label for="">
          <img src="images/Sinner-Ash.webp" width="150px" height="100px" />
        </label>
        <br />
        <input type="radio" id="moonseye" name="relic-pic" />
        <label for=""
          ><img src="images/MOONSEYE totem 2.webp" width="150px" height="100px"
        /></label>
        <br />
        <input type="radio" id="Idol-of-Yun'shul" name="relic-pic" />
        <label for=""
          ><img src="images/idol-of-yun-shul.jpg" width="150px" height="100px"
        /></label>
        <br />
      </fieldset>
      <br />
      <fieldset>
        <legend>Things Players Can Do With the Idol of Yun'Shul</legend>
        <!-- Create a table where the headings are Question and Answer -->
        <label for="idol-depths">
          What does the Idol of Yun'Shul automatically allow you to escape?
        </label>
        <input type="text" id="idol-depths" name="traitOne" />
        <br />
        <label for="">What does the Idol of Yun'Shul relieve you of?</label>
        <input type="text" id="idol-flaw" name="traitTwo" />
        <br />
        <input type="text" id="1" name="traitThree" />
        <label for="">What does the Idol of Yun'shul reroll?</label>
        <br />
      </fieldset>
      <button type="submit">Submit</button>
    </form>
  </body>
